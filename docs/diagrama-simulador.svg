<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2290" width="1000" height="2290"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1000" height="2290" fill="#fff"/><ellipse cx="470" cy="24" rx="34" ry="19" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="28.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">Inicio</tspan></text><rect x="300.0" y="72" width="340" height="34" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="93.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">1. Leer procesos desde archivo CSV o carga manual</tspan></text><polygon points="470,128.0 660.0,190 470,252.0 280.0,190" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="172.65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">2. ¿Datos válidos?</tspan><tspan x="470" dy="14.5">1 a 10 procesos, ids únicos,</tspan><tspan x="470" dy="14.5">tamaño 1 a 450K,</tspan><tspan x="470" dy="14.5">arribo ≥ 0, irrupción ≥ 1</tspan></text><rect x="35.0" y="170" width="170" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="120" y="187.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="120" dy="0">Mostrar todos</tspan><tspan x="120" dy="14.5">los errores</tspan></text><ellipse cx="120" cy="250" rx="34" ry="19" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="120" y="254.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="120" dy="0">Fin</tspan></text><rect x="310.0" y="278" width="320" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="297.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">3. t = 0</tspan><tspan x="470" dy="14.5">Memoria: SO 100K + un hueco de 450K</tspan></text><rect x="270.0" y="348" width="400" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="369.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">4. evento = falso</tspan><tspan x="470" dy="14.5">Si en el ciclo anterior terminó un proceso: evento = verdadero</tspan></text><polygon points="470,435.0 640.0,490 470,545.0 300.0,490" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="479.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">5. ¿Queda algún Listo/Susp.</tspan><tspan x="470" dy="14.5">sin revisar?</tspan><tspan x="470" dy="14.5">(por orden de arribo; empate: id)</tspan></text><polygon points="135,435.0 250.0,490 135,545.0 20.0,490" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="135" y="487.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="135" dy="0">6. Best Fit:</tspan><tspan x="135" dy="14.5">¿hay hueco &gt;= tamaño?</tspan></text><rect x="20.0" y="575" width="220" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="130" y="594.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="130" dy="0">7. Asignar el menor hueco</tspan><tspan x="130" dy="14.5">que alcanza. Pasa a Listo</tspan></text><rect x="270.0" y="575" width="400" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="594.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">8. Si algún proceso tiene arribo = t:</tspan><tspan x="470" dy="14.5">evento = verdadero</tspan></text><polygon points="470,665.0 650.0,720 470,775.0 290.0,720" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="709.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">9. ¿Queda algún Nuevo con</tspan><tspan x="470" dy="14.5">arribo &lt;= t sin revisar?</tspan><tspan x="470" dy="14.5">(por orden de arribo; empate: id)</tspan></text><polygon points="140,670.0 260.0,720 140,770.0 20.0,720" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="140" y="709.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="140" dy="0">10. ¿Hay cupo?</tspan><tspan x="140" dy="14.5">Ejec + Listo +</tspan><tspan x="140" dy="14.5">Listo/Susp &lt; 5</tspan></text><polygon points="140,810.0 260.0,860 140,910.0 20.0,860" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="140" y="857.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="140" dy="0">11. Best Fit:</tspan><tspan x="140" dy="14.5">¿hay hueco &gt;= tamaño?</tspan></text><rect x="280.0" y="835" width="130" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="345" y="849.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="345" dy="0">Asignar menor</tspan><tspan x="345" dy="14.5">hueco que alcanza.</tspan><tspan x="345" dy="14.5">Pasa a Listo</tspan></text><rect x="30.0" y="940" width="220" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="140" y="959.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="140" dy="0">Pasa a Listo/Suspendido</tspan><tspan x="140" dy="14.5">(ocupa cupo, sin memoria)</tspan></text><rect x="300.0" y="1000" width="340" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1019.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">12. Para cada Listo sin ingreso registrado:</tspan><tspan x="470" dy="14.5">ingreso_listo = t</tspan></text><polygon points="470,1065.0 610.0,1110 470,1155.0 330.0,1110" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1107.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">13. ¿Hay proceso</tspan><tspan x="470" dy="14.5">en Ejecución?</tspan></text><polygon points="200,1065.0 310.0,1110 200,1155.0 90.0,1110" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="200" y="1114.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="200" dy="0">14. ¿Hay Listos?</tspan></text><rect x="15.0" y="1090" width="50" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="40" y="1107.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="40" dy="0">CPU</tspan><tspan x="40" dy="14.5">ociosa</tspan></text><rect x="55.0" y="1190" width="290" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="200" y="1212.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="200" dy="0">Elegir el Listo de menor tiempo restante</tspan><tspan x="200" dy="14.5">(empate: menor arribo, menor id).</tspan><tspan x="200" dy="14.5">Pasa a Ejecución</tspan></text><polygon points="690,1170.0 850.0,1225 690,1280.0 530.0,1225" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="690" y="1214.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="690" dy="0">15. ¿Algún Listo tiene restante</tspan><tspan x="690" dy="14.5">ESTRICTAMENTE menor</tspan><tspan x="690" dy="14.5">al que ejecuta?</tspan></text><rect x="350.0" y="1180" width="160" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="430" y="1200.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="430" dy="0">SRTF: el que ejecutaba</tspan><tspan x="430" dy="14.5">pasa a Listo y conserva</tspan><tspan x="430" dy="14.5">su partición. El Listo de</tspan><tspan x="430" dy="14.5">menor restante pasa</tspan><tspan x="430" dy="14.5">a Ejecución</tspan></text><polygon points="470,1330.0 590.0,1375 470,1420.0 350.0,1375" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1372.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">16. ¿evento =</tspan><tspan x="470" dy="14.5">verdadero?</tspan></text><rect x="10.0" y="1335" width="290" height="82" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="155" y="1358.65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="155" dy="0">17. Mostrar: CPU (o CPU ociosa), tabla de</tspan><tspan x="155" dy="14.5">particiones (id, inicio, tamaño, proceso,</tspan><tspan x="155" dy="14.5">frag. interna), colas de Listos y Listos/Susp.</tspan><tspan x="155" dy="14.5">Pausa: espera al usuario</tspan></text><polygon points="470,1470.0 600.0,1515 470,1560.0 340.0,1515" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1512.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">18. ¿Hay proceso</tspan><tspan x="470" dy="14.5">en Ejecución?</tspan></text><rect x="310.0" y="1585" width="320" height="36" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1607.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">19. Ejecutar 1 unidad: restante = restante - 1</tspan></text><polygon points="470,1650.0 570.0,1690 470,1730.0 370.0,1690" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1694.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">20. ¿Restante = 0?</tspan></text><rect x="310.0" y="1760" width="320" height="62" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1780.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">21. Terminado, fin = t + 1</tspan><tspan x="470" dy="14.5">Liberar partición y cupo</tspan><tspan x="470" dy="14.5">Fusionar huecos contiguos</tspan></text><rect x="390.0" y="1870" width="160" height="34" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1891.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">22. t = t + 1</tspan></text><polygon points="470,1930.0 610.0,1975 470,2020.0 330.0,1975" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="1972.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">23. ¿Quedan procesos</tspan><tspan x="470" dy="14.5">por terminar?</tspan></text><rect x="320.0" y="2050" width="300" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="2069.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">24. Mostrar el estado final</tspan><tspan x="470" dy="14.5">(terminó el último proceso)</tspan></text><rect x="320.0" y="2118" width="300" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="2144.65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">25. Informe final por proceso:</tspan><tspan x="470" dy="14.5">TR = fin - ingreso_listo</tspan><tspan x="470" dy="14.5">TE = TR - irrupción</tspan><tspan x="470" dy="14.5">Promedios y rendimiento</tspan></text><ellipse cx="470" cy="2250" rx="34" ry="19" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="470" y="2254.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000"><tspan x="470" dy="0">Fin</tspan></text><path d="M 470,43 L 470,72" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 470,106 L 470,128" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 280,190 L 205,190" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="248" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">no</text><path d="M 120,210 L 120,231" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 470,252 L 470,278" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="486" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">si</text><path d="M 470,322 L 470,348" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 470,396 L 470,435" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 300,490 L 250,490" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="275" y="483" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">si</text><path d="M 135,435 L 135,415" fill="none" stroke="#000" stroke-width="1.5"/><path d="M 20,597 L 8,597 L 8,415 L 470,415" fill="none" stroke="#000" stroke-width="1.5"/><text x="280" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">no: sigue con el siguiente (conserva su lugar en la cola)</text><path d="M 135,545 L 135,575" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="151" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">si</text><path d="M 470,545 L 470,575" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="486" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#000">no</text><path d="M 470,619 L 470,665" fill="none" stroke="#000" stroke-width="1.5" mar